name: KeyBar
options:
  bundleIdPrefix: com.rossnicholson
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

packages:
  HouseStyle:
    url: https://github.com/RossNicholson/mac-house-style
    from: 1.1.0

targets:
  KeyBar:
    type: application
    platform: macOS
    sources:
      - path: KeyBar
      - path: Shared
    dependencies:
      - package: HouseStyle
      # The MCP server Claude Code runs. It lives in Contents/Helpers.
      - target: KeyBarHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: KeyBar/Info.plist
      properties:
        CFBundleDisplayName: KeyBar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Ross Nicholson. MIT licence."
    settings:
      base:
        PRODUCT_NAME: KeyBar
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.KeyBar
        CODE_SIGN_ENTITLEMENTS: KeyBar/KeyBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - KeyBarTests

  # The `keybar` command: the MCP server that Claude Code starts. It asks the
  # running app for a key, runs the command with it and hides it in the output.
  KeyBarHelper:
    type: tool
    platform: macOS
    sources:
      - path: KeyBarHelper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: keybar
        PRODUCT_MODULE_NAME: KeyBarHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.KeyBar.helper
        # Gives the tool an identity in its signature, which the app checks
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: KeyBarHelper/Info.plist
        OTHER_CODE_SIGN_FLAGS: "--identifier com.rossnicholson.KeyBar.helper"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES

  KeyBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeyBarTests
    dependencies:
      - target: KeyBar
